name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Enable manual run
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commitlint:
    name: Check commit messages
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Run commitlint
      uses: wagoid/commitlint-github-action@3d28780bbf0365e29b144e272b2121204d5be5f3 # v6.1.2

  ruff:
    name: Run Ruff checks
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python 3.14
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.14"

    - name: Install Ruff
      run: python -m pip install ruff==0.13.0

    - name: Run Ruff
      run: ruff check .

  tests:
    name: Python ${{ matrix.python_version }}
    runs-on: ubuntu-latest
    env:
      ISSUER: http://localhost:8888/
      GDPR_API_AUDIENCE: http://example.com/exampleapi
      GDPR_API_AUTHORIZATION_FIELD: http://example.com
      GDPR_API_QUERY_SCOPE: exampleapi.gdprquery
      GDPR_API_DELETE_SCOPE: exampleapi.gdprdelete
      GDPR_API_URL: http://example.com/gdpr-api/v1/user/$user_uuid
    strategy:
      matrix:
        python_version: ["3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python ${{ matrix.python_version }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ matrix.python_version }}

    - name: Install hatch
      run: python -m pip install hatch==1.18.0

    - name: Run tests
      run: hatch test -c -i py=${{ matrix.python_version }}

    - name: Generate coverage report
      run: hatch run coverage xml -o coverage-${{ matrix.python_version }}.xml

    - name: Upload coverage report
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: coverage-${{ matrix.python_version }}
        path: coverage-${{ matrix.python_version }}.xml

  sonarcloud:
    name: Run SonarQube Cloud Scan
    runs-on: ubuntu-latest
    needs: tests

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # Required by SonarQube Cloud
        fetch-depth: 0

    - name: Download coverage data
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        merge-multiple: true
        path: .coverage-reports

    - name: SonarQube Cloud Scan
      uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
